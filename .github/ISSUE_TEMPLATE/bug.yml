name: Bug
description: Something behaves differently than intended.
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      value: |
        **Expected:**

        **Actual:**
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: View, component, or store if you know it.
